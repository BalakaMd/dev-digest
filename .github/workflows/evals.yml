# Harness evals — runs the DevDigest Claude Code evals on OpenRouter, selectively.
#
# MANUAL ONLY: no pull_request trigger, so no LLM call ever runs automatically. Start it from
# Actions → evals → Run workflow (pick the branch). To re-enable per-PR runs, restore the
# `pull_request:` block (paths: .claude/**, **/CLAUDE.md, **/AGENTS.md, evals/**, this file).
#
# We diff the branch against main and run ONLY the suites the change touches:
#   • a changed skill      → that skill's evals        (content tier, native OpenRouter, no proxy)
#   • a changed agent      → that agent's evals + the workflow tier
#   • a changed CLAUDE.md / AGENTS.md (root or package) → the workflow tier
#   • an engine change     → the workflow tier
# A changed artifact with no written evals is reported as SKIP, not a failure.
#
# Models are workflow_dispatch inputs (not surfaced in any UI). Every tier defaults to DeepSeek V4
# Flash: skills call OpenRouter directly; agents/workflow go through the LiteLLM proxy, which
# translates the Agent SDK's Anthropic wire format to DeepSeek. Caveat (evals/README.md): DeepSeek
# tends to do the work inline instead of dispatching a subagent, so the workflow dispatch case may
# fail; pass tool_model=anthropic/claude-haiku-4.5 (reliable, ~$1/run) or google/gemini-2.5-flash
# when you need that tier green.

name: evals

on:
  workflow_dispatch:
    inputs:
      skills_model:
        description: 'OpenRouter slug for the skills (content) tier'
        default: 'deepseek/deepseek-v4-flash'
      tool_model:
        description: 'OpenRouter slug for the agents + workflow (tool) tiers'
        default: 'deepseek/deepseek-v4-flash'

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Detect which suites this PR should run ──────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        working-directory: evals
        env:
          # Manual run: diff the chosen branch against main (merge-base), so only touched suites run.
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          RANGE="$(git merge-base "origin/$BASE_REF" HEAD)...HEAD"
          CHANGED_FILES="$(git diff --name-only "$RANGE")"
          export CHANGED_FILES
          node scripts/ci-detect.mjs

  # ── 2. Skills — content tier, native OpenRouter, no proxy ──────────────────
  skills:
    needs: changes
    if: needs.changes.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.changes.outputs.skills) }}
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.skills_model || 'deepseek/deepseek-v4-flash' }}
      EVAL_JUDGE_MODEL: ${{ inputs.skills_model || 'deepseek/deepseek-v4-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run "skills/${{ matrix.skill }}/"

  # ── 3. Agents — tool tier, needs the LiteLLM translating proxy ─────────────
  agents:
    needs: changes
    if: needs.changes.outputs.agents != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each matrix entry is its own runner with its own proxy container — agents fan out in
      # parallel, no serial wait.
      matrix:
        agent: ${{ fromJSON(needs.changes.outputs.agents) }}
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      OPENROUTER_BASE_URL: http://localhost:4000
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.tool_model || 'deepseek/deepseek-v4-flash' }}
      EVAL_JUDGE_MODEL: ${{ inputs.tool_model || 'deepseek/deepseek-v4-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm exec vitest run "agents/${{ matrix.agent }}/" --no-file-parallelism
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down

  # ── 4. Workflow — live-harness tier. Non-blocking: activation cases are ────
  #     behaviour-shaped and only "indicative" on non-Anthropic models (README).
  workflow:
    needs: changes
    if: needs.changes.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      OPENROUTER_BASE_URL: http://localhost:4000
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.tool_model || 'deepseek/deepseek-v4-flash' }}
      EVAL_JUDGE_MODEL: ${{ inputs.tool_model || 'deepseek/deepseek-v4-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm exec vitest run workflow --no-file-parallelism
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
